title: MCP server - the audit trail stopped, or the server crashed
id: 5a0f4c1e-7b1d-4c62-9a34-0c6f2f6d1a04
status: experimental
description: >
  sys_monitor_disabled is written when the trail comes back after it could not be written: its detail says since when
  and how many events were not recorded. While the trail is down the server refuses every change, and by default
  everything else. sys_crash is the server stopping on a failure nobody handled. A server whose disk is gone can write
  neither, so pair this rule with the monitoring system's own "no records from this instance" check.
references:
  - docs/06-SECURITY-ROADMAP.md (Phase 3, P3.6, P3.7)
author: McpServerTemplate
date: 2026-10-09
logsource:
  product: mcp-server
  service: audit
detection:
  selection:
    event|re:
      - '^sys_monitor_disabled(:|$)'
      - '^sys_crash(:|$)'
  condition: selection
fields:
  - datetime
  - event
  - description
  - detail.missed
  - detail.since
  - hostname
  - instance
level: critical
