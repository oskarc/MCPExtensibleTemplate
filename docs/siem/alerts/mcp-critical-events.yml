title: MCP server - an event that is always an alert
id: 5a0f4c1e-7b1d-4c62-9a34-0c6f2f6d1a01
status: experimental
description: >
  Any one of these is worth a person's attention when it happens: instructions found in a tool's output, a revoked
  caller's token presented again, an outbound call the frame refused, a revocation the identity provider did not take,
  or a tool definition that is not the one that was reviewed.
references:
  - docs/06-SECURITY-ROADMAP.md (Phase 3, P3.7)
author: McpServerTemplate
date: 2026-10-09
x-roadmap-case: critical-event
logsource:
  product: mcp-server
  service: audit
detection:
  selection:
    event|re:
      - '^mcp_prompt_injection(:|$)'
      - '^authn_token_reuse(:|$)'
      - '^mcp_egress_denied(:|$)'
      - '^mcp_revocation_failed(:|$)'
      - '^mcp_tool_poisoning(:|$)'
  condition: selection
fields:
  - datetime
  - event
  - description
  - principal.idp
  - principal.sub
  - mcp.provider
  - mcp.target
  - decision.rule
  - trace_id
  - hostname
  - instance
level: critical
