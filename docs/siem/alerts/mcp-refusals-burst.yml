title: MCP server - a refused request
id: 5a0f4c1e-7b1d-4c62-9a34-0c6f2f6d1a02
status: experimental
description: >
  One request the caller was not allowed to make. On its own this is ordinary - a client asking for a tool it has no
  scope for. It is the base of the correlation below.
references:
  - docs/06-SECURITY-ROADMAP.md (Phase 3, P3.7)
author: McpServerTemplate
date: 2026-10-09
logsource:
  product: mcp-server
  service: audit
detection:
  selection:
    event|re: '^authz_fail(:|$)'
  condition: selection
fields:
  - datetime
  - principal.idp
  - principal.sub
  - mcp.target
  - decision.rule
  - source_ip
level: low
---
title: MCP server - many refusals for one caller in ten minutes
id: 5a0f4c1e-7b1d-4c62-9a34-0c6f2f6d1a03
status: experimental
description: >
  Five or more refused requests from one caller in ten minutes: a client working through what it is not allowed, or an
  agent steered into trying. Five is this repository's starting figure, not a measured one; the roadmap leaves the
  number open. Set it from what your callers normally do.
references:
  - docs/06-SECURITY-ROADMAP.md (Phase 3, P3.7)
author: McpServerTemplate
date: 2026-10-09
x-roadmap-case: refusals-in-ten-minutes
correlation:
  type: event_count
  rules:
    - 5a0f4c1e-7b1d-4c62-9a34-0c6f2f6d1a02
  group-by:
    - principal.idp
    - principal.sub
  timespan: 10m
  condition:
    gte: 5
level: high
