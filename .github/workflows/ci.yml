name: CI

# contract-001 · G-9 — every push, not only pull requests: the guarantee is that nothing
# reaches a branch without having been restored from the lock file, built with warnings as
# errors, tested, audited for vulnerable packages and scanned for credentials.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Reads global.json, so CI builds on the SDK band the repository declares. Without this
      # the runner took whatever 10.0.x was newest and its analyser set differed from a
      # developer's, which UC-7 ("the same runs on every machine") does not allow.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # --locked-mode fails if packages.lock.json does not match the project files, so a
      # dependency cannot change without the change being visible in the diff.
      - name: Restore (locked)
        run: dotnet restore McpServerTemplate.sln --locked-mode

      - name: Build (warnings are errors)
        run: dotnet build McpServerTemplate.sln --no-restore --configuration Release -warnaserror

      # contract-005 · G-14 — the fast suite by project path, so the end-to-end suite (its own job
      # below) never runs here and this step stays as fast as it was.
      - name: Test
        run: dotnet test McpServerTemplate.Tests/McpServerTemplate.Tests.csproj --no-build --configuration Release --verbosity normal

      # Direct and transitive. NuGetAudit already fails the build through warnings-as-errors;
      # this step states the finding plainly rather than leaving it in build output.
      - name: Audit packages
        run: |
          set -o pipefail
          output=$(dotnet list McpServerTemplate.sln package --vulnerable --include-transitive 2>&1 | tee /dev/stderr)
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable package(s) found. Upgrade or replace them."
            exit 1
          fi

      - name: Secret scan
        run: bash scripts/secret-scan.sh

  # contract-005 · G-14 — the end-to-end suite: the server image built from the repository's
  # Dockerfile, on its own network with Keycloak, the test issuer, the upstream fake, Redis and the
  # TLS front (McpServerTemplate.E2E). A separate job on every push, running beside the fast one
  # rather than after it, so neither waits for the other. No step pushes any image.
  e2e:
    runs-on: ubuntu-latest

    # contract-005 · G-14 — the wall-clock budget. The walking skeleton's job, measured on this runner
    # (run 36256722454, 2026-09-26, cold: image builds, pulls and Keycloak), took 1 min 47 s. Add the
    # confirmation-expiry wait T-8 must sit out (121 s), and a stated margin of three times the measured
    # job (5 min 21 s) for the test classes still to come, each with its own server: 9 min 09 s, set at
    # 10. Exceeding it fails the job, and reshaping the suite is put to the pioneer rather than the
    # number raised quietly.
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore McpServerTemplate.sln --locked-mode

      - name: Build (warnings are errors)
        run: dotnet build McpServerTemplate.sln --no-restore --configuration Release -warnaserror

      # contract-005 · G-11, T-12 — a sabotage weakens the environment on purpose, to see one test go red on its claim;
      # it is run locally (scripts/e2e-sabotage.sh), never here. The harness refuses to start with MCP_E2E_SABOTAGE set
      # in CI; this step says so first, before anything runs.
      - name: No sabotage
        run: |
          if [ -n "${MCP_E2E_SABOTAGE+set}" ]; then
            echo "::error::MCP_E2E_SABOTAGE is set ('${MCP_E2E_SABOTAGE}'). Sabotages run locally, with scripts/e2e-sabotage.sh, and never in CI."
            exit 1
          fi

      # The first test starts the shared environment, cold: image builds, pulls and Keycloak (about a
      # minute here). The hang timeout is per test, so it must cover that start and sit well inside the
      # job's budget; a test that exceeds it is named and killed
      # rather than holding the job until the budget runs out. No dump is taken (contract-005 · T-13,
      # nothing left behind): a dump of the test process would hold the run's Keycloak client secrets
      # and minted tokens, and would be uploaded with the bundle below for 14 days.
      - name: End-to-end tests
        run: >-
          dotnet test McpServerTemplate.E2E/McpServerTemplate.E2E.csproj --no-build --configuration Release
          --logger "console;verbosity=detailed" --logger "trx;LogFileName=e2e.trx"
          --results-directory TestResults
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      # contract-005 · T-13 — no key or certificate is left behind after a run, and nothing else the run created: its run
      # directory in the temp folder, which holds the test PKI's keys; any container or network carrying the harness's run
      # label; and mcp-server:latest, the name the docs profile gives the run's image for docs/04's compose file and takes
      # back after it. Checked whether the tests passed or failed, since a failure is when a teardown is most likely to
      # have been skipped. The images the harness builds are kept by design (they carry no run label).
      - name: Nothing left behind
        if: ${{ !cancelled() }}
        run: |
          left=0
          for dir in "${TMPDIR:-/tmp}"/mcp-e2e-*; do
            [ -e "$dir" ] || continue
            echo "::error::A run directory, with the test PKI's keys, was left in the temp folder: $dir"
            left=1
          done
          for container in $(docker ps -a --filter label=org.mcp-server-template.e2e.run --format '{{.Names}}'); do
            echo "::error::A container carrying the harness's run label was left: $container"
            left=1
          done
          for network in $(docker network ls --filter label=org.mcp-server-template.e2e.run --format '{{.Name}}'); do
            echo "::error::A network carrying the harness's run label was left: $network"
            left=1
          done
          if docker image inspect mcp-server:latest > /dev/null 2>&1; then
            echo "::error::The docs profile's tag mcp-server:latest was left on the run's image."
            left=1
          fi
          exit "$left"

      # The diagnostics bundle: every container's log, the fake's journal, the issuers' counts and the
      # per-phase timings (written by the harness under TestResults/e2e/), with the trx.
      - name: Upload diagnostics bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          retention-days: 14
