name: CI

# contract-001 · G-9 — every push, not only pull requests: the guarantee is that nothing
# reaches a branch without having been restored from the lock file, built with warnings as
# errors, tested, audited for vulnerable packages and scanned for credentials.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Reads global.json, so CI builds on the SDK band the repository declares. Without this
      # the runner took whatever 10.0.x was newest and its analyser set differed from a
      # developer's, which UC-7 ("the same runs on every machine") does not allow.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # --locked-mode fails if packages.lock.json does not match the project files, so a
      # dependency cannot change without the change being visible in the diff.
      - name: Restore (locked)
        run: dotnet restore McpServerTemplate.sln --locked-mode

      - name: Build (warnings are errors)
        run: dotnet build McpServerTemplate.sln --no-restore --configuration Release -warnaserror

      # contract-005 · G-14 — the fast suite by project path, so the end-to-end suite (its own job
      # below) never runs here and this step stays as fast as it was.
      - name: Test
        run: dotnet test McpServerTemplate.Tests/McpServerTemplate.Tests.csproj --no-build --configuration Release --verbosity normal

      # Direct and transitive. NuGetAudit already fails the build through warnings-as-errors;
      # this step states the finding plainly rather than leaving it in build output.
      - name: Audit packages
        run: |
          set -o pipefail
          output=$(dotnet list McpServerTemplate.sln package --vulnerable --include-transitive 2>&1 | tee /dev/stderr)
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable package(s) found. Upgrade or replace them."
            exit 1
          fi

      - name: Secret scan
        run: bash scripts/secret-scan.sh

  # contract-005 · G-14 — the end-to-end suite: the server image built from the repository's
  # Dockerfile, on its own network with Keycloak, the test issuer, the upstream fake, Redis and the
  # TLS front (McpServerTemplate.E2E). A separate job on every push, running beside the fast one
  # rather than after it, so neither waits for the other. No step pushes any image.
  e2e:
    runs-on: ubuntu-latest

    # BUDGET PLACEHOLDER — contract-005 · G-14: the wall-clock budget is the walking skeleton's
    # measured job time plus a stated margin, and it counts the confirmation-expiry wait. It is
    # recorded on the contract before T-2 onward are written; until a run on this runner has been
    # measured, this number is a placeholder, not a budget. Exceeding it fails the job.
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore McpServerTemplate.sln --locked-mode

      - name: Build (warnings are errors)
        run: dotnet build McpServerTemplate.sln --no-restore --configuration Release -warnaserror

      # The first test starts the shared environment, cold: image builds, pulls and Keycloak. The hang
      # timeout is per test, so it must cover that start; a test that exceeds it is named and killed
      # rather than holding the job until the budget runs out. No dump is taken (contract-005 · T-13,
      # nothing left behind): a dump of the test process would hold the run's Keycloak client secrets
      # and minted tokens, and would be uploaded with the bundle below for 14 days.
      - name: End-to-end tests
        run: >-
          dotnet test McpServerTemplate.E2E/McpServerTemplate.E2E.csproj --no-build --configuration Release
          --logger "console;verbosity=detailed" --logger "trx;LogFileName=e2e.trx"
          --results-directory TestResults
          --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type none

      # The diagnostics bundle: every container's log, the fake's journal, the issuers' counts and the
      # per-phase timings (written by the harness under TestResults/e2e/), with the trx.
      - name: Upload diagnostics bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          retention-days: 14
