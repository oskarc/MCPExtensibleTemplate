name: Sabotage retake

# contract-005 · T-12 (G-11), G-17 round 1 (HAR-R1-01, HAR-R1-02) — the reds, proved. The per-push check (HarnessSelfTests, in
# ci.yml's end-to-end job) proves coverage and freshness of each test file: every test the runner lists has a sabotage, and
# each recorded red was taken on its test's file as it is now. It cannot prove a red was taken, and a change to the harness or
# the product marks no red stale. This workflow proves the reds: from a clean checkout it takes every sabotage afresh
# (scripts/e2e-sabotage.sh --all), each with its control run, and fails when any sabotage does not go red on its claim, when
# a regenerated verdict differs from the committed record's, or when anything a run created is left behind. The record it
# wrote is kept as the run's artifact. It pushes nothing: no commit, no image.
#
# It is the one CI run the harness admits a sabotage in: this workflow, started on its schedule or by hand
# (Sabotage.RetakeWorkflow). A push or a pull request is refused, whichever workflow it starts.

on:
  schedule:
    # Weekly: Monday, 03:17 UTC.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sabotage-retake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retake:
    runs-on: ubuntu-latest

    # Its own timeout. Measured here, not on the runner: a red took 49 s (23 in 18 min 45 s, 2026-09-29), so 99 reds and the
    # control run are about an hour and a half. The runner's time is not yet measured; this allows it two and a half times
    # that, and the first run's time is to be recorded against it. A run that exceeds it fails, and its reshaping is put to
    # the pioneer rather than the number raised quietly.
    timeout-minutes: 240

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore McpServerTemplate.sln --locked-mode

      # --all takes every red afresh; --same-verdicts fails when any verdict differs from the record as checked out, which
      # a clean checkout makes the committed one. The script exits 1 when a sabotage is not red on its claim, when a
      # verdict changed, or when a run left anything behind.
      - name: Retake every sabotage
        run: bash scripts/e2e-sabotage.sh --all --same-verdicts

      - name: Upload the regenerated record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sabotage-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: McpServerTemplate.E2E/SABOTAGE-RECORD.md
          retention-days: 30
