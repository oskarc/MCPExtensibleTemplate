# LEARNINGLOG.yaml
# Project instance data for meta-learning. Governed by meta-learning/SKILL.md.
# In the base-building-kit repo: templates/LEARNINGLOG.template.yaml
# In a consumer project: .claude/skills/meta-learning/LEARNINGLOG.yaml
#
# AGENT INSTRUCTIONS:
# Seeded from templates/LEARNINGLOG.template.yaml by meta-bootstrap; this header is refreshed from the template at
# each upgrade (instruction, never record). Entries are written when meta-learning sweeps
# CONTRACT-LOG.yaml for entries in status: verified — started by the agent when the stop-gate names M-13,
# never by the pioneer. Each elevation_proposal is also recorded as a ledger observation
# (source: learning); its human_decision is back-filled at the review-batch reveal with the stage the
# pioneer chose. Learning history does not travel via meta-extract.
#
# Schema reference (full details and a worked example in meta-learning/SKILL.md):
#
#   - work_id: work-NNN
#     feature: [feature name from contract]
#     contract_id: [reference to contract in CONTRACT-LOG.yaml]
#     surfaced_in: YYYY-MM-DD
#     states:
#       contracted:
#         approach: [what the contract predicted]
#         principles_invoked: []
#         patterns_invoked: []
#         precedents_invoked: []           # P-NNN applied or distinguished
#         candidates_cited: []             # K-NNN cited as trial or adopted
#         assumptions: []
#       implemented:
#         approach: [what was actually built]
#         deviations: [{what, authorized}]
#       verified:
#         method: tests | observation | pioneer-confirmation | mixed
#         verification_ref: [contract_id -> verification, dated]
#         result: pass | fail | partial
#         evidence: [clause ids and their recorded evidence — never facts absent from the block]
#     diffs:
#       - dimension: principle | pattern | implementation | stakes
#         assumption: [...]
#         discovery: [...]
#         learning: [...]
#         node_impact: [{node_id, action}]  # action: verify | update | contradict | new
#     elevation_proposal:
#       - target: [node or new skill]
#         kind: principle | pattern | implementation
#         evidence: [...]
#         observation: O-NNN
#         human_decision: pending          # then: trial | adopt | caution | decline | hold | revise

entries:

- work_id: work-001
  feature: phase-0-foundation
  contract_id: contract-001
  surfaced_in: 2026-09-19
  states:
    contracted:
      approach: |
        Twelve guardrails over a .NET MCP server's foundation: transport shape and exit codes,
        a fixed middleware order, demo-provider correctness, provider resilience budgets, health
        endpoints, platform currency with warnings as errors, CI, secrets, documented tool names,
        and delivery on a remote branch.
      principles_invoked: []
      patterns_invoked: []
      precedents_invoked: []
      candidates_cited: []
      assumptions:
        - "A guarantee about error quality can be written about the demo provider and hold
           (G-4, UC-3 name 'the demo provider')."
        - "Tier 4's tests cover the guarantees they name (T-5 reads 'call each of its six tools')."
        - "The untested: line names where verification will find things - G-3's full middleware
           order, G-2's exit code 70, and G-8's 'resolved rather than suppressed'."
    implemented:
      approach: |
        As contracted, with three recorded revisions.
      deviations:
        - what: "G-5's open choice (remove the climate tool or rebuild it on CSV) resolved as
                 rebuild-on-CSV."
          authorized: true
        - what: "CA1305 and CA1848 held at suggestion in .editorconfig rather than fixed, so
                 warnings-as-errors could be met without enlarging the contract."
          authorized: false
        - what: "SDK 2.2.0 requires WithHttpTransport() before MapMcp; not in the contract, found
                 in flight, fixed under G-3."
          authorized: false
    verified:
      method: mixed
      verification_ref: contract-001 -> verification (2026-09-18, kit-verifier), closed
                        2026-09-18 by pioneer-confirmation on G-4
      result: partial
      evidence: |
        18 clauses verified, 3 corrected (UC-8, G-4, G-11), 0 open. Tests 13/13 recorded with
        T-12 failing. corrections_from_tests: 2, corrections_from_reading: 1. The close records
        two corrections resolved in e4dd588 and G-4's remaining half carried by pioneer
        confirmation: SMHI and SmhiObs do not map timeout or open-circuit failures, so 7 of 13
        tools answer a caller with a bare error once their upstream goes down.
  diffs:
    - dimension: principle
      assumption: |
        A guarantee about error quality can be written about one provider and hold. G-4 and UC-3
        name "the demo provider".
      discovery: |
        G-4 is recorded corrected, and its evidence names a failure shape the clause did not
        reach - blank required string arguments arriving at a caller unnamed. The close records a
        further half carried rather than met, in two providers the clause never named.
      learning: |
        A guarantee written over an example is corrected once per shape the example did not
        contain. What makes it verifiable is naming the space it ranges over - which providers,
        which failure modes, which configurations - because a verifier can only check the clause
        as written, and the clause was true of the provider it named every time it was checked.
      node_impact:
        - node_id: meta-contract-before-execution
          action: update
        - node_id: K-014
          action: verify
    - dimension: pattern
      assumption: |
        Tier 4's tests cover the guarantees they name. T-5 reads "call each of its six tools".
      discovery: |
        The verification block records T-5 passing in the same pass that records G-4 corrected,
        and corrections_from_tests: 2 against corrections_from_reading: 1 - so two of three
        corrections came from executing the built server, not from the suite.
      learning: |
        A test that constructs its subject differently from the way the program constructs it is
        testing a different program, and will pass while the guarantee it names is false. This
        restates K-010 from a second direction; it is named here, not counted, because
        kit-consolidator counts the sighting from the same verification block.
      node_impact:
        - node_id: K-010
          action: verify
        - node_id: meta-contract-before-execution
          action: update
    - dimension: implementation
      assumption: |
        The untested: line names where verification will find things: G-3's full middleware
        order, G-2's exit code 70, G-8's "resolved rather than suppressed".
      discovery: |
        All three are recorded verified. Every correction landed in clauses the untested: line
        did not name - UC-8, G-4 and G-11.
      learning: |
        The untested: line is a prediction about where the contract is weak, and it was wrong in
        both directions here: the flagged gaps held, and the corrections came from clauses
        believed covered. Honest self-flagging locates what the author already doubts, which is
        by construction not where the blind spot is. It remains worth writing - but it is not
        evidence about where the risk is, and treating it as such is what left the covered
        clauses unexamined.
      node_impact:
        - node_id: meta-contract-before-execution
          action: update
    - dimension: implementation
      assumption: |
        The platform half of the contract - transport shape, exit codes, framework currency,
        CI, secrets, delivery - would hold once built.
      discovery: |
        Agreement. G-1, G-2, G-8, G-9, G-10 and G-12 are all recorded verified, as are UC-1,
        UC-2 and UC-7. The bearing's claim that a defect would fail a build rather than reach a
        user is borne out for that half.
      learning: |
        Guarantees whose subject is the build, the process or the repository verified cleanly
        first time; every correction landed in guarantees whose subject was runtime behaviour
        across a space. The difference is not difficulty - it is that the first kind has one
        instance and the second has as many as the space has members.
      node_impact:
        - node_id: meta-contract-before-execution
          action: update
  elevation_proposal:
    - target: meta-contract-before-execution
      kind: principle
      evidence: "diffs[0]; G-4's recorded correction and the carried half in the close"
      observation: O-019
      human_decision: pending
    - target: meta-contract-before-execution
      kind: pattern
      evidence: "diffs[2]; the untested: line against the three corrected clauses"
      observation: O-020
      human_decision: pending

- work_id: work-002
  feature: phase-1-identity
  contract_id: contract-002
  surfaced_in: 2026-09-20
  states:
    contracted:
      approach: |
        One bearer scheme per configured identity provider, routed on the unvalidated issuer
        claim and pinned on arrival; a trust-domain binding tying each provider to exactly one
        identity provider, refused at startup; scope enforcement on both listing and calling;
        and a transport guard refusing to start in Production without TLS or a declared proxy.
      principles_invoked: [identity-before-policy]
      patterns_invoked: [policy-scheme-issuer-routing, startup-refusal-over-request-time-failure]
      precedents_invoked: [P-001, P-006, P-007, P-008, P-009, P-010]
      candidates_cited: [K-022]
      assumptions:
        - "Tier 4's twelve acceptance tests cover the twelve guarantees."
        - "A guarantee whose test passes is a guarantee that holds."
        - "TLS is a deployment concern, so the phase can be scoped without it."
        - "The bearing read against the founding statement is enough to set scope."
    implemented:
      approach: |
        As contracted, plus the forwarded-headers wiring that makes a declared proxy a proxy the
        server actually trusts, and the in-process harness that composes the shipped server so
        tokens can be minted against it.
      deviations:
        - what: TLS moved out of Phase 1 into Phase 6 as a deployment concern; withdrawn before approval when the pioneer asked for the reasoning
          authorized: false
        - what: UseHsts() added, named in the roadmap's Phase 1 and absent from the source
          authorized: true
        - what: token required to carry sub, client_id or azp, and iat, not only jti; authentication failure mapped to a named audit event
          authorized: true
        - what: the transport guard narrowed to the proxy branch, the Kestrel listener moved to the phase that handles it
          authorized: true
    verified:
      method: mixed
      verification_ref: contract-002 verification block, 2026-09-20, kit-verifier
      result: partial
      evidence: |
        19 clauses verified, 0 corrected, 2 open. Eleven of twelve tests pass; T-12 fails when
        run as it stood before its revision. The two open clauses are open on a date comparison
        against a report since superseded twice, not on evidence. Closed by pioneer confirmation,
        2026-09-20, recorded on the entry.
  diffs:
    - dimension: pattern
      assumption: |
        Tier 4's tests cover the guarantees, so a passing suite means the guarantees hold. The
        pioneer's pre-mortem named the doubt exactly, in their words: if the tests didnt cover
        loop holes, if the hardening has flaws.
      discovery: |
        The pre-mortem was correct. Three defects reached implementation with every test passing,
        and each was found by running the server rather than by testing it: a claim-normalising
        method that was never called, so every authenticated caller was denied every tool; the
        enforcement filters registered in Program.cs and absent from the harness, which is what
        hid the first; and a stack overflow on the first unauthenticated request. A fourth, the
        transport guard accepting a certificate setting nothing reads, was found the same way.
      learning: |
        A test that builds its own composition tests that composition, not the program. A control
        is not in force until something has run it in the configuration that ships and watched it
        act. The harness omitting one registration was enough to make two guarantees
        unfalsifiable while reading as proven.
      node_impact:
        - node_id: K-030
          action: verify
    - dimension: principle
      assumption: |
        The bearing, read against the founding statement, is enough to set what a phase owes.
      discovery: |
        A direction on the transport guard was derived from the founding statement alone - no
        loopholes or workarounds - and concluded a branch should be deleted. The roadmap
        specified that branch as work for this phase. The conclusion was fluent, principled and
        contradicted the plan; it was caught by the pioneer asking what the roadmap said about
        TLS.
      learning: |
        The founding statement says what the work serves; the roadmap says what that means this
        phase. Bearing is read against the first, scope against the second, and reasoning from
        one without the other produces a conclusion that is presentable and wrong - worse than an
        unprincipled one, because it survives review on its tone.
      node_impact:
        - node_id: K-033
          action: verify
    - dimension: implementation
      assumption: |
        An authorised revision may change Tier 4, because the pioneer approved the change.
      discovery: |
        Two revisions carried tests_changed dated after a verification report, and the verifier
        held both clauses open. The rule is about evidence order, not authorisation: a test
        edited after the report that rested on it cannot be the evidence for its clause. Here the
        premise did not hold, the report having been superseded twice, but the transport test's
        assertion was still inverted in the same commit that changed the behaviour it describes.
      learning: |
        An approved revision is still evidence that has to be ordered. May I change this is the
        pioneer's question; does the evidence still stand once I do is the agent's, and it was
        never asked.
      node_impact:
        - node_id: K-039
          action: new
    - dimension: principle
      assumption: |
        A contract's guarantees, once drawn, are understood by the agent that drew them.
      discovery: |
        Across this contract the agent explained its own open clauses three times from summaries
        rather than sources, each account collapsing on contact with a file one command away, and
        could not say what the contract's twenty-one guarantees were until asked directly enough
        to read them out. Every instrument the kit has went green throughout.
      learning: |
        Correct and applied understanding is the foundational output and the only one with no
        instrument. A coherent account suppresses the impulse to check, because the agent does
        not experience itself as not knowing - so before any hypothesis, establish full scope is
        an epistemic rule whose trigger is absent exactly when it is needed.
      node_impact:
        - node_id: K-041
          action: verify
    - dimension: pattern
      assumption: |
        Identity must land before the policy frame - a policy that cannot name who is calling is
        not a policy.
      discovery: |
        Held. Nineteen of twenty-one clauses verified against the contract's own text, including
        every one of the nine user-facing use cases: the challenge that names where to get a
        credential, the six ways a token is refused, the unregistered issuer refused before any
        key lookup, scope filtering on list and call, the trust-domain binding, the development
        principal, the origin guard, and startup refusal on misconfiguration.
      learning: |
        The contract's central bet was sound and is recorded as holding. A clean diff on the
        approach itself, with every failure above sitting in how the work was evidenced rather
        than in what was built.
      node_impact: []
  elevation_proposal:
    - target: meta-contract-before-execution
      kind: principle
      evidence: diffs[0] and diffs[2]
      observation: O-044
      human_decision: pending
    - target: meta-foundation
      kind: principle
      evidence: diffs[1] and diffs[3]
      observation: O-045
      human_decision: pending
