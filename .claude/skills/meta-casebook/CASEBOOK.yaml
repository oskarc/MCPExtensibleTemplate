      the omission was reported as a bookkeeping failure rather than a missing plan.
    question: |
      Whether a contract must exist before a change is made, and what the contract is for.
    holding: |
      Without a contract there is nothing to run the lay of the land for, and no plan. The roadmap exists
      to be broken down into contracts that feed the standard's development — the point is not to produce
      an MCP server, the point is to build the standard. The meta approach enforces a contract for every
