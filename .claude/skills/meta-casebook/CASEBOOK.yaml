# CASEBOOK.yaml
# Project instance data. Governed by meta-casebook/SKILL.md.
# In the base-building-kit repo: templates/CASEBOOK.template.yaml
# In a consumer project: .claude/skills/meta-casebook/CASEBOOK.yaml
#
# AGENT INSTRUCTIONS:
# Seeded from templates/CASEBOOK.template.yaml by meta-bootstrap, which then appends any type-category precedents
# inherited from a library kit (tier: type-category, with {bindings} to re-bind); this header is refreshed from the
# template at each upgrade (instruction, never record). kit-case-clerk writes precedents and scenario
# cards; the main agent appends distinguished_by entries at contract approval; only the pioneer overrules.
#
# Schema:
#
#   precedents:
#     - prec_id: P-NNN                      # sequential, never reused
#       date: YYYY-MM-DD
#       from: [C-NNN, contract-NNN, drift-NNN, K-NNN]
#       moments: [M-NN]                     # retrieval key
#       tier: project | type-category
#       facts: |
#         [material facts only; project-specific names in {braces} when tier is type-category]
#       question: |
#         [what had to be decided]
#       holding: |
#         [what was decided — binds matching situations]
#       reasons: |
#         [the pioneer's reasons, verbatim, or: none recorded]
#       binding: true
#       distinguished_by: []                # {date, contract_id, how_facts_differ}
#       status: active | overruled
#       overruled_by: null                  # C-NNN
#
#   scenarios:
#     - card_id: S-NNN
#       date: YYYY-MM-DD
#       from: [C-NNN, P-NNN]
#       moment: M-NN
#       situation: |
#         [the decision point as it stood]
#       options:
#         - key: A
#           text: [option]
#       pioneer_ranking: pending            # or [B, A, C] — only from the pioneer
#       rationale: |
#         [the pioneer's, verbatim]
#       dissent: |
#         [a minority view the pioneer gave, or: none]
#
#   reconstruction_tests:
#     - test_id: RT-NNN
#       date: YYYY-MM-DD
#       kit_version: [manifest version]
#       held_out: [C-NNN, B-NNN/I-n]
#       decisions_tested: 0
#       matched: 0
#       misses: []                           # {item, predicted, actual, what the kit lacked}

precedents:
  - prec_id: P-001
    date: 2026-09-17
    from: [C-001]
    moments: [M-27]
    tier: project
    facts: |
      During install/upgrade orientation (M-27), the agent's lay-of-the-land step surfaced other local
      repositories/projects reachable in this session as a potential conflict for the install, and described
      (without quoting) the projects they belong to.
    question: |
      Whether the agent may reference or look at other local repositories in this workspace during
      orientation or later work on this project.
    holding: |
      The agent must never reference any other local repo in this work, and must never look at other local
      repos in this workspace.
    reasons: |
      I am building a product that is in no way related to other repos, i dont want to show the public every
      technical thing im building all jumbled up in this product.
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "not checkable — the holding forbids referencing an open-ended, session-specific set of other repositories; a script enforcing it would have to hardcode those repositories' names in this checked-in file, which the correction itself forbids"

