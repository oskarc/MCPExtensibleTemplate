# CASEBOOK.yaml
# Project instance data. Governed by meta-casebook/SKILL.md.
# In the base-building-kit repo: templates/CASEBOOK.template.yaml
# In a consumer project: .claude/skills/meta-casebook/CASEBOOK.yaml
#
# AGENT INSTRUCTIONS:
# Seeded from templates/CASEBOOK.template.yaml by meta-bootstrap, which then appends any type-category precedents
# inherited from a library kit (tier: type-category, with {bindings} to re-bind); this header is refreshed from the
# template at each upgrade (instruction, never record). kit-case-clerk writes precedents and scenario
# cards; the main agent appends distinguished_by entries at contract approval; only the pioneer overrules.
#
# Schema:
#
#   precedents:
#     - prec_id: P-NNN                      # sequential, never reused
#       date: YYYY-MM-DD
#       from: [C-NNN, contract-NNN, drift-NNN, K-NNN]
#       moments: [M-NN]                     # retrieval key
#       tier: project | type-category
#       facts: |
#         [material facts only; project-specific names in {braces} when tier is type-category]
#       question: |
#         [what had to be decided]
#       holding: |
#         [what was decided — binds matching situations]
#       reasons: |
#         [the pioneer's reasons, verbatim, or: none recorded]
#       binding: true
#       distinguished_by: []                # {date, contract_id, how_facts_differ}
#       status: active | overruled
#       overruled_by: null                  # C-NNN
#
#   scenarios:
#     - card_id: S-NNN
#       date: YYYY-MM-DD
#       from: [C-NNN, P-NNN]
#       moment: M-NN
#       situation: |
#         [the decision point as it stood]
#       options:
#         - key: A
#           text: [option]
#       pioneer_ranking: pending            # or [B, A, C] — only from the pioneer
#       rationale: |
#         [the pioneer's, verbatim]
#       dissent: |
#         [a minority view the pioneer gave, or: none]
#
#   reconstruction_tests:
#     - test_id: RT-NNN
#       date: YYYY-MM-DD
#       kit_version: [manifest version]
#       held_out: [C-NNN, B-NNN/I-n]
#       decisions_tested: 0
#       matched: 0
#       misses: []                           # {item, predicted, actual, what the kit lacked}

precedents:
  - prec_id: P-001
    date: 2026-09-17
    from: [C-001]
    moments: [M-27]
    tier: project
    facts: |
      During install/upgrade orientation (M-27), the agent's lay-of-the-land step surfaced other local
      repositories/projects reachable in this session as a potential conflict for the install, and described
      (without quoting) the projects they belong to.
    question: |
      Whether the agent may reference or look at other local repositories in this workspace during
      orientation or later work on this project.
    holding: |
      The agent must never reference any other local repo in this work, and must never look at other local
      repos in this workspace.
    reasons: |
      I am building a product that is in no way related to other repos, i dont want to show the public every
      technical thing im building all jumbled up in this product.
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "not checkable — the holding forbids referencing an open-ended, session-specific set of other repositories; a script enforcing it would have to hardcode those repositories' names in this checked-in file, which the correction itself forbids"

  - prec_id: P-002
    date: 2026-09-17
    from: [C-002]
    moments: [M-27]
    tier: project
    facts: |
      During install/upgrade orientation (M-27), immediately after the no-other-repos rule was recorded
      (C-001, P-001), the agent put a further decision to the pioneer by asking a direct question — whether to
      write `P-001.sh` as a path-shape check — without first setting out the surrounding situation for the
      pioneer's context.
    question: |
      Whether the agent may put a decision to the pioneer by asking for input alone, or must also include the
      pioneer in the context the decision depends on.
    holding: |
      The agent must include the pioneer in the context, instead of only asking for input.
    reasons: |
      none recorded
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "not checkable — the holding is a judgement about what counts as sufficient context in a question, not a fixed shape a script could verify"

  - prec_id: P-003
    date: 2026-09-17
    from: [C-003]
    moments: [M-27]
    tier: project
    facts: |
      Following the no-other-repos rule (P-001) and the correction on including context (C-002), the agent
      recommended writing a path-shape check script (`P-001.sh`) under the kit's mechanisms to enforce that
      rule, describing it as about ten lines that would run with the kit's other checks.
    question: |
      Whether a rule of engagement between the pioneer and the agent, outside the kit's subject matter, should
      be encoded as a script under the kit's mechanisms.
    holding: |
      Do not write the script. It is not part of the kit — it is rules of engagement between the pioneer and
      the agent.
    reasons: |
      its not part of the kit its rules of engagement for you and me
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "not checkable — the holding itself forbids turning this class of rule into a script; a check enforcing it would do the thing the holding declines to do, and deciding what counts as a rule of engagement rather than a kit rule is judgement"

  - prec_id: P-004
    date: 2026-09-17
    from: [C-004]
    moments: [M-07, M-24]
    tier: project
    facts: |
      The agent proposed letting a further proposal run — one that would, in its own words, "rewrite the kit's
      own foundation" over the no-other-repos rule — reasoning that a refused proposal is worth having on
      record even if the pioneer would decline it with one word.
    question: |
      Whether a personal instruction to the agent, unrelated to the founding statement's subject, belongs in
      the kit's foundation or its learning.
    holding: |
      It does not. Telling the agent not to read other repos is not part of the standard building kit for an
      MCP server, has nothing to do with it, and should not be part of the learning.
    reasons: |
      Me telling you to not read other repos is not part of the STANDARD BUILDING KIT for a mcp server, it
      has nothing to do with that.
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "not checkable — deciding whether a directive bears on the founding statement's subject is judgement, not a shape a script could verify"

  - prec_id: P-005
    date: 2026-09-17
    from: [C-005]
    moments: [M-14]
    tier: project
    facts: |
      During ledger consolidation (M-14), the agent referred to a prior casebook precedent by id alone
      ("The useful one is P-004, which turns your last message into a standing rule...") without first
      stating what P-004 says, where it came from, or why it was being raised, although the pioneer had
      not seen it before.
    question: |
      Whether the agent may cite a kit artifact (a precedent) by id when presenting it to the pioneer,
      or must first give the pioneer the context needed to understand what it is and why it matters.
    holding: |
      You need to present with context. The pioneer has never seen the artifact and does not know in
      what regard it matters or why it is being raised — that context must be given, not assumed.
    reasons: |
      i have never seen P-004 and dont know in what regard it matters or why you are telling me.
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "not checkable — deciding whether a given presentation includes sufficient context for the pioneer is judgement, not a fixed shape a script could verify"

  - prec_id: P-006
    date: 2026-09-17
    from: [C-006]
    moments: [M-14]
    tier: project
    facts: |
      During ledger consolidation (M-14), immediately after being corrected for presenting an artifact
      without context (C-005), the agent offered two ways to handle a duplicate/redundant precedent
      concerning the no-other-repos rule: do nothing and keep following the rule as recorded, or retire
      the first of the two precedents and keep the second, which states the boundary correctly.
    question: |
      Whether to retire/consolidate the redundant precedent now, mid-consolidation, or defer that
      cleanup and move on to other work.
    holding: |
      Follow the rule from memory but don't take it further — do not retire or consolidate now. Commit
      and push, then move to the roadmap for the hardening work.
    reasons: |
      none recorded
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "not checkable — a one-off prioritisation decision (defer housekeeping, move to other work), not a fixed shape a script could verify"

  - prec_id: P-007
    date: 2026-09-17
    from: [C-007]
    moments: [M-04]
    tier: project
    facts: |
      While drawing contract-001's guardrails and acceptance tests (M-04), the agent asked, per
      guardrail, what result would make the pioneer say it wasn't met, noting "same as it says" was a
      real answer it would record as one. The pioneer answered for the guardrails generally, not one at
      a time.
    question: |
      When Tier 4 disappointment content (and similarly the use cases and other tiers) is open, should
      the agent draw it out clause-by-clause from the pioneer, or draft defaults for the pioneer to
      adjust or confirm?
    holding: |
      Same as it reads. Write Tier 4 by default, and the use cases and other tiers the same way — the
      pioneer adjusts them or confirms your question that they hold, rather than answering individually.
    reasons: |
      none recorded
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "not checkable — choosing whether to elicit answers individually or draft defaults for confirmation is judgement, not a fixed shape a script could verify"

  - prec_id: P-008
    date: 2026-09-18
    from: [C-008]
    moments: [M-12, M-04]
    tier: project
    facts: |
      Four verification passes into contract-001 (M-12), each needing a resume to deliver a report at
      47-67 tool calls, the agent put a scoping choice to the pioneer among keeping the cycling cost,
      splitting verification into smaller scopes, or closing out via a follow-up contract.
    question: |
      What was causing the repeated-iteration cost during contract-001's verification, and what should
      change because of it.
    holding: |
      The cause was not that the work could not be figured out, but that the work was not grounded
      properly before it began — a symptom of too limited a lay of the land before the contract begins.
      What would have been right is laying the land first, drawing the map before starting, so what is
      implemented is accurate and the environment and surroundings are known.
    reasons: |
      (carried in the statement: the issue is not that we cant know what to do, but that we dont ground
      our work properly before we begin)
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "not checkable — judging whether a contract's lay-of-the-land was adequate before it began is judgement about investigation quality, not a fixed shape a script could verify"

  - prec_id: P-009
    date: 2026-09-18
    from: [C-009]
    moments: [M-03]
    tier: project
    facts: |
      Reflecting on C-008's frame-reset (contract-001), the agent suggested the missing lay-of-the-land
      might be a new, session-specific pattern rather than a repeated habit. The pioneer corrected this:
      the practice of drawing the map before beginning work is written in meta-foundation's INTENT.md as
      a core part of the practice ("Lay of the land" among the agent's five aspects), not something new
      to this session.
    question: |
      Whether the requirement to lay the land / draw the map before beginning work was a new pattern
      that started in this session, or an existing, already-documented core practice.
    holding: |
      It is not new. Drawing the map before you begin is a core part of the practice — read
      meta-foundation in full.
    reasons: |
      (carried in the statement: it is a core part of the practice)
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "not checkable — whether a given omission is a novel pattern or a lapse in an already-documented practice is judgement, not a fixed shape a script could verify"

  - prec_id: P-010
    date: 2026-09-19
    from: [C-010, contract-002]
    moments: [M-04, M-18]
    tier: project
    facts: |
      contract-002 was approved with twelve guardrails and thirteen acceptance tests. When the pioneer
      asked what to look at next, six guardrails were done, one partial, five untouched, and two of
      thirteen tests written. The agent offered three readings of the question — survey Phase 2 now,
      draw contract-003 now, or finish contract-002 first — and recommended surveying Phase 2 alongside
      finishing contract-002, deferring contract-003 until contract-002 was verified.
    question: |
      Whether to survey or scope work beyond contract-002 (Phase 2, contract-003) while contract-002
      remained mostly unimplemented, or to finish the approved contract first.
    holding: |
      That was very sloppy — add a driftlog entry about not completing the contract, then do 3: finish
      contract-002 before anything beyond it.
    reasons: |
      (carried in the statement: the contract was not completed)
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "P-010.sh: passes"

