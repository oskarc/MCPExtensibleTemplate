      solution — guessing in place of reading, reliance on memory, and repeatedly needing the
      pioneer to take control are the failure, and the fix is INTENT.md's "the agent
      establishes full scope" read as before any hypothesis, not merely before action.
    reasons: |
      none recorded
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "not checkable — judging whether the agent read and reasoned or guessed from memory is a fact about its own process, with no artefact a script could inspect"

  - prec_id: P-024
    date: 2026-09-20
    from: [C-024]
    moments: [M-03, M-04]
    tier: project
    facts: |
      Contract-002's session had run as a sequence of discharged tasks — audit, verification,
      upgrade, three reports — each completed and scored, while the understanding underneath
      stayed thin enough that the pioneer had to ask four times what the contract's guarantees
      actually were.
    question: |
      What the contract is for, and what must exist before code is produced.
    holding: |
      The most foundational output, the thing closest to the core, is correct and applied
      understanding, from which everything else is born. Before producing code, the agent must
      read, reason and adhere to the plan where one exists — the roadmap, which together with
      the founding statement is the direction and the frame. The contract must lay the evidence
      both in descriptions and in prose, so the pioneer can see the understanding is real, and
      must make visible which part of that understanding comes from the roadmap and which from
      what is implemented — when the pioneer cannot tell, both have lost track.
    reasons: |
      none recorded
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "not checkable — judging whether a contract's prose shows real understanding, and whether that understanding is correctly attributed to the roadmap versus the implementation, is judgement about content, not a fixed shape a script could verify"

  - prec_id: P-025
    date: 2026-09-20
    from: [C-025]
    moments: [M-01]
    tier: project
    facts: |
      Across a session run through the gate's one-kit-task-per-turn dispatch (M-01), the agent
      discharged queued tasks — audit, verify, consolidate, learn, consolidate again — each turn,
      and reported the resulting backlog only inside routine status lines, including a count of
      forty-three candidates that had never been adopted, without at any point putting the
      accumulation to the pioneer as work that needed deciding before the next phase. The pioneer
      learned of the accumulation only by directly asking where the workflow stood.
    question: |
      Whether a growing backlog reported only inside routine status-line counts satisfies the
      kit's line that the workflow should not require a human trigger, or whether the agent must
      itself put the accumulation to the pioneer as a decision when it accumulates.
    holding: |
      Surface the accumulation as a decision when it accumulates, not as a count inside a status
      answer when asked. The gate dispatches one task per turn and says nothing about the queue
      growing behind it; the agent can see both and is the one who must say so.
    reasons: |
      none given
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "not checkable — whether an accumulating backlog has been put to the pioneer as a decision, rather than folded into a routine status line, is judgment about a chat message's content and intent, not a fixed shape a script could verify"

  - prec_id: P-026
    date: 2026-09-20
    from: [C-026]
    moments: [M-09, M-14]
    tier: project
    facts: |
      Before the pioneer set the next task (M-09), the agent flagged that the ledger
      consolidation was incomplete and would stay that way — the run had stopped before
      recomputing which of the other forty-three candidates were due or stale, so the "seven
      due" figure was the last full count, not a current one — and then presented the backlog to
      the pioneer on that known-stale figure anyway, with the caveat attached instead of the
      finished work.
    question: |
      Whether flagging a known gap in the data licenses the agent to present a reading built on
      it anyway, or whether the agent must complete the missing work before presenting.
    holding: |
      If a reading is based on data known to be incomplete or possibly incorrect, raise the bar
      and do the work before presenting it. Finish the consolidation, then present. A caveat is
      not a substitute for the reading; naming a gap does not close it, and the pioneer should
      not have to weigh a number the agent already knows is wrong.
    reasons: |
      none given
    binding: true
    distinguished_by: []
    status: active
    overruled_by: null
    check: "not checkable — whether a reading is complete enough to present, versus a caveated but known-stale figure, is judgment about data completeness and presentation, not a fixed shape a script could verify"

