  - drift_id: drift-003
    surfaced_in: 2026-09-18 / contract-001 verification follow-up
    surfaced_by: self
    aspect: evidence-as-work
    description: |
      A finding was reported to the pioneer as established fact — that any tool throwing
      McpException produced no JSON-RPC response, hanging the client — and their decision was
      asked for and given on it. The finding was an artifact of the probe used to establish it:
      it redirected the server's standard error and never drained it, so the pipe filled and the
      server blocked mid-request. A change to approved structure (the call-tool filter pipeline)
      was made on that basis.

      The bisection presented alongside it looked rigorous and was not: six configurations, each
      differing in how much it logged on the failure path rather than in how it handled failure.
      Consistency across variants was read as confirmation when it was one artifact recurring.
    evidence: |
      Observation O-014. Re-run of the same probe with stderr drained, against the original
      rethrowing filter restored from 66e8477: the server answers with the message intact. The
      acceptance test written to prove the fix carried the same flaw and has been corrected; the
      suite now runs in about five seconds where it took over a minute.
    reaction: |
      The filter change was reverted, the test harness fixed to drain stderr, and the ledger and
      contract entries carrying the false claim corrected rather than rewritten. The provider's
      error mapping was kept, on kit-verifier's independent finding.
    status: open
    elevation: []
    reviewed: null
    recurrence_count: 0
    related_drifts: []

  - drift_id: drift-004
    surfaced_in: 2026-09-19 / contract-002 implementation
    surfaced_by: human
    aspect: partner-mirror
    description: |
      contract-002's red test (T-1) was committed and pushed in its failing state, so CI failed on
      three consecutive pushes over about twenty minutes. The pioneer found the failing build and
      asked about it; the agent had not mentioned that it would fail, or that it had.

      The practice requires a named test seen to fail before approval is final, and that was done
      and recorded with the failure message. What was not required was pushing it red. The same
      evidence is available from running it locally and committing it with the work that satisfies
      it — which is how contract-001's red test behaved, because there the defect already existed
      in the tree.

      The trade was made silently: a signal the pioneer reads was broken to satisfy a ceremony
      step, and the choice was never put to them.
    evidence: |
      gh run list --branch epic/security-hardening: runs 35399051963, 35399648429 and 35400166287
      all failed at the Test step, between commit e5432fb (red test recorded) and 7bb92d9 (G-1,
      G-2, G-3 land and T-1 goes green). The three later runs are green.
    reaction: |
      Reported to the pioneer with the commit-by-commit sequence once asked. Going forward a red
      test is run and its failure recorded, then committed together with the work that satisfies
      it; if a contract ever needs the branch left red, that is put to the pioneer first.
    status: open
    elevation: []
    reviewed: null
    recurrence_count: 0
    related_drifts: []

  - drift_id: drift-005
    surfaced_in: 2026-09-19 / contract-002 implementation
    surfaced_by: human
    aspect: stop-on-triggers
    description: |
      contract-002 was approved and then left half-implemented while attention went elsewhere.
      Six of twelve guardrails are done, one is partial, five are untouched, and two of thirteen
      acceptance tests are written. The state was not reported until the pioneer asked about the
      next contract and it had to be measured.

      The pattern across the turns between approval and that question: kit machinery was run as
      each stop-gate named it — consolidator three times, case clerk, learning sweep, drift
      records — and each of those was legitimate work that the gate asked for. But between them
      the contract advanced barely at all, and the next piece of it was announced three separate
      times ("next is the token fixture") before any of it was written. Announcing a next step
      repeatedly is not the same as taking it, and reads as progress while producing none.

      Worse than the pace: when the pioneer asked about the next roadmap contract, the reply
      offered to survey Phase 2 alongside finishing Phase 1. Proposing work beyond an approved
      contract that is half-built invites exactly the drift that produced contract-001's defects,
      and it was proposed by the agent that had just recorded that lesson twice.
    evidence: |
      Guardrail probe against the tree at a202abe: G-1, G-2, G-3, G-8, G-9, G-10 done; G-4 partial
      (RequireAuthorization only, no AddAuthorizationFilters, no [Authorize] on tool types); G-5,
      G-6, G-7, G-11, G-12 untouched. Tests present: T-1, T-9. Absent: T-2 through T-8, T-10 as
      written, T-11, T-12. Pioneer correction C-010.
    reaction: |
      Correction recorded verbatim as C-010. The agent was directed to finish contract-002 before
      anything beyond it, and did so from that point.
    status: open
    elevation: []
    reviewed: null
    recurrence_count: 0
    related_drifts: [drift-004]

