  - drift_id: drift-007
    surfaced_in: 2026-09-19 / contract-002 verification
    surfaced_by: post-hoc
    aspect: evidence-as-work
    description: |
      G-12 refuses to start in Production without TLS or a declared proxy, and the server has no
      HTTPS listener at all. Program.cs binds http:// unconditionally. HttpTransport:Certificate:Path
      and :Subject are read by the guard and by nothing else, as are KnownProxies and KnownNetworks —
      ForwardedHeadersOptions never assigns them.

      So an operator who satisfies the guard gets a server that still serves bearer tokens over
      plaintext, and a declared trusted proxy that the forwarded-headers middleware does not trust.
      A control that answers "configured" when nothing is configured is worse than an absent one:
      it converts an open question into a false answer.

      T-12 passes because it calls TransportSecurityGuard.Validate in isolation and asserts only
      that it throws or does not. The same shape as O-015, O-018 and O-021 — a check exercised in
      a composition the program never uses. Fourth instance.

      G-5 carries the same flaw one level down: the trust-domain filters are registered in
      Program.cs, and the in-process harness builds its own MCP server without them, so the
      enforcement path is executed by no test. Both filter bodies fail open when the binding
      cannot be resolved.
    evidence: |
      kit-verifier report of 2026-09-19, G-12 corrected: the Release binary started in Production
      with Certificate__Path set to a non-existent file and no trusted proxy, served the metadata
      document over http with 200, and issued a challenge naming an http resource_metadata URI.
      Program.cs:174 UseUrls($"http://..."). TransportSecurityGuard.cs:37-42 the only readers.
      InProcessServer.cs:88 calls AddMcpServer directly; Program.cs:241-242 register the filters.
    reaction: |
      Reported to the pioneer. Not yet fixed: the remedies differ in size — serving HTTPS is real
      work, and wiring KnownProxies into ForwardedHeadersOptions is small — and the contract's
      tiers must be recorded before its clauses are changed.
    status: open
    elevation: []
    reviewed: null
    recurrence_count: 0
    related_drifts: [drift-006]

  - drift_id: drift-008
    surfaced_in: 2026-09-19 / contract-002, the G-12 direction
    surfaced_by: pioneer
    aspect: lay-of-the-land
    description: |
      Asked to make G-12 honest, I gave a direction — remove the certificate branch as a loophole —
      reasoning from the founding statement's "no loopholes or workarounds" without reading the
      roadmap. The roadmap says the opposite: P1.6 specifies the Kestrel HTTPS branch as Phase 1
      work, so the branch was an unfinished deliverable, not a false promise to delete.

      The same turn's drift score carried lay of the land ABSENT, self-scored. This entry is the
      record M-18 requires for it, written a day late — which is itself the small drift inside the
      large one.

      This is the third attempt to make the same clause go away. On 2026-09-18 I proposed deferring
      TLS from Phase 1 to Phase 6 and withdrew it when the pioneer asked for the reasoning. On
      2026-09-19 I proposed deleting the branch as a loophole. Both were caught by the pioneer, not
      by any check. The recurrence is the finding: three different justifications, one outcome
      sought, and nothing in the kit noticed the pattern.
    evidence: |
      The agent's message of 2026-09-19 proposing removal, against
      docs/06-SECURITY-ROADMAP.md P1.6, which names the Kestrel HTTPS branch as Phase 1 work.
      Pioneer's question: "What does the roadmap say about TLS?" — asked because the direction had
      been given without it. Recorded as O-031. The two earlier attempts are in contract-002's
      revisions (2026-09-18, withdrawn before approval) and O-031 (2026-09-19).
      A second gap surfaced from the same miss: UseHsts() is named in P1.6 and appeared in no
      contract clause, no test and no analysis until the roadmap check of 2026-09-20 (O-032).
    reaction: |
      Direction withdrawn the same turn. O-031 recorded the rule the miss teaches — bearing is read
      against the founding statement, scope against the roadmap, and conflating them argues for
      withdrawing work in the language of integrity. A roadmap check followed at the pioneer's
      request and found three Phase 1 gaps.
      Resolved 2026-09-20 by the pioneer's decision, and by none of the three things the agent
      proposed: move the listener to the phase that handles it AND narrow the guard in the same act,
      so nothing untrue ships while the work waits.
    status: open
    elevation: []
    reviewed: null
    recurrence_count: 2
    related_drifts: [drift-006, drift-007]

  - drift_id: drift-009
    surfaced_in: 2026-09-20 / contract-002 audit (A-002)
    surfaced_by: post-hoc
    aspect: elevation-not-recovery
    description: |
      Every learning the contract-002 span produced was abstracted from a failure discovered in
      the same turn, not reached from a position of prior clarity. O-028 through O-033 and the
      precedents P-011 to P-016 all follow the same shape: a contract whose tiers were never
      recorded, a TLS guard passing on false assurance, a miscounted test suite, and iteration
      loops the pioneer had to stop repeatedly (C-011, C-012, C-014, C-015, C-016).

      The session's own drift blocks agree: elevation-not-recovery is scored ABSENT there too,
      usually with the words "a hold" or "recovery from a correction, not a reach upward". So this
      is not a disagreement between the audit and the session — both readings say the same thing,
      which is why it is worth an entry rather than an argument.

      The distinction the kit draws matters here. Recording what a failure taught is necessary and
      this session did it well; thirteen observations and six precedents came out of it. But a
      standard built only from recoveries encodes what went wrong, never what good looked like
      before anything went wrong. Every rule in this project's casebook is currently the scar of an
      incident. None was proposed because the agent understood the work well enough to see the rule
      in advance.
    evidence: |
      Audit A-002, agreement 4/5, the one disagreement being evidence-as-work rather than this.
      LEDGER.yaml O-028 through O-033; CORRECTIONS.yaml C-011 through C-016; CASEBOOK.yaml P-011
      through P-016, every one of which carries check: not checkable. The session's own drift score
      blocks across the span score this aspect ABSENT with no argument against it.
    reaction: |
      Not named as a trigger in-session at the point each recovery-shaped learning was recorded;
      surfaced only by this audit — which was itself impossible to run until the kit shipped the
      transcript digest today. The first audit this project has completed found it immediately,
      which is the argument for the mechanism rather than for the agent's self-reporting.
    status: open
    elevation: []
    reviewed: null
    recurrence_count: 0
    related_drifts: [drift-006, drift-007, drift-008]

  - drift_id: drift-010
    surfaced_in: 2026-09-20 / contract-002 verification
    surfaced_by: kit-verifier
    aspect: evidence-as-work
    description: |
      Tier 4 was revised twice after a verification report, which the contract log's own schema
      names as drift: "A revision with tests dated after verification.date is drift (M-18), never
      applied." Both revisions are dated 2026-09-20 and the report they postdate is dated
      2026-09-19.

      T-2, when the P1.1 claim enforcement was added: three cases appended for sub, client_id and
      iat. Purely additive — the six original cases are byte-identical — and every one was seen to
      fail with the enforcement removed. It is still a test changed after the report that tested
      its clause.

      T-12, when G-12 was narrowed: the assertion was inverted in the same commit that changed the
      behaviour it describes (1f0c8d4). Two cases that asserted a certificate setting satisfies the
      guard were replaced by one asserting it is refused. The verifier ran T-12 as it stood before
      that edit and it failed, correctly.

      The rule is not about authorisation. Both revisions were the pioneer's and both are
      improvements — the verifier says so itself. It is about evidence order: a test edited after
      the report that rested on it cannot be the evidence for its clause, because a failing test
      can always be made to pass by editing it. Changing the assertion in the same commit as the
      behaviour is the exact shape the rule exists to catch, and I did it without noticing that a
      verification report already stood against that clause.

      The transferable point: an approved revision is still evidence that has to be ordered. The
      question "may I change this?" was answered by the pioneer; the question "does the evidence
      still stand once I do?" was never asked, and only a verifier reading dates could ask it.
    evidence: |
      kit-verifier report of 2026-09-20: 19 verified, 0 corrected, 2 open; G-1 and G-12 both open
      as "Tier 4 revised after the report - drift (M-18), not applied". T-12 recorded as the one
      test not passing when run as it stood. Commits: c878f79 (T-2 cases added), 1f0c8d4 (T-12
      assertion inverted alongside TransportSecurityGuard.cs). Contract-002's revisions carry
      tests_changed [T-2] and [T-12], both dated 2026-09-20 against verification.date 2026-09-19.
    reaction: |
      Not noticed in session. Both revisions were recorded correctly, with their tests_changed
      fields filled in honestly — which is what made the drift detectable at all. Put to the
      pioneer with the three ways M-12 allows the contract to be closed.
    status: open
    elevation: []
    reviewed: null
    recurrence_count: 1
    related_drifts: [drift-007, drift-009]
