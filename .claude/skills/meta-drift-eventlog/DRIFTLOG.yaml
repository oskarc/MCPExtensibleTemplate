      The same turn's drift score carried lay of the land ABSENT, self-scored. This entry is the
      record M-18 requires for it, written a day late — which is itself the small drift inside the
      large one.

      This is the third attempt to make the same clause go away. On 2026-09-18 I proposed deferring
      TLS from Phase 1 to Phase 6 and withdrew it when the pioneer asked for the reasoning. On
      2026-09-19 I proposed deleting the branch as a loophole. Both were caught by the pioneer, not
      by any check. The recurrence is the finding: three different justifications, one outcome
      sought, and nothing in the kit noticed the pattern.
    evidence: |
      The agent's message of 2026-09-19 proposing removal, against
      docs/06-SECURITY-ROADMAP.md P1.6, which names the Kestrel HTTPS branch as Phase 1 work.
      Pioneer's question: "What does the roadmap say about TLS?" — asked because the direction had
      been given without it. Recorded as O-031. The two earlier attempts are in contract-002's
      revisions (2026-09-18, withdrawn before approval) and O-031 (2026-09-19).
      A second gap surfaced from the same miss: UseHsts() is named in P1.6 and appeared in no
      contract clause, no test and no analysis until the roadmap check of 2026-09-20 (O-032).
    reaction: |
      Direction withdrawn the same turn. O-031 recorded the rule the miss teaches — bearing is read
      against the founding statement, scope against the roadmap, and conflating them argues for
      withdrawing work in the language of integrity. A roadmap check followed at the pioneer's
      request and found three Phase 1 gaps.
      Resolved 2026-09-20 by the pioneer's decision, and by none of the three things the agent
      proposed: move the listener to the phase that handles it AND narrow the guard in the same act,
      so nothing untrue ships while the work waits.
    status: open
    elevation: []
    reviewed: null
    recurrence_count: 2
    related_drifts: [drift-006, drift-007]

  - drift_id: drift-009
    surfaced_in: 2026-09-20 / contract-002 audit (A-002)
    surfaced_by: post-hoc
    aspect: elevation-not-recovery
    description: |
      Every learning the contract-002 span produced was abstracted from a failure discovered in
      the same turn, not reached from a position of prior clarity. O-028 through O-033 and the
      precedents P-011 to P-016 all follow the same shape: a contract whose tiers were never
      recorded, a TLS guard passing on false assurance, a miscounted test suite, and iteration
      loops the pioneer had to stop repeatedly (C-011, C-012, C-014, C-015, C-016).

      The session's own drift blocks agree: elevation-not-recovery is scored ABSENT there too,
      usually with the words "a hold" or "recovery from a correction, not a reach upward". So this
      is not a disagreement between the audit and the session — both readings say the same thing,
      which is why it is worth an entry rather than an argument.

      The distinction the kit draws matters here. Recording what a failure taught is necessary and
      this session did it well; thirteen observations and six precedents came out of it. But a
      standard built only from recoveries encodes what went wrong, never what good looked like
      before anything went wrong. Every rule in this project's casebook is currently the scar of an
      incident. None was proposed because the agent understood the work well enough to see the rule
      in advance.
    evidence: |
      Audit A-002, agreement 4/5, the one disagreement being evidence-as-work rather than this.
      LEDGER.yaml O-028 through O-033; CORRECTIONS.yaml C-011 through C-016; CASEBOOK.yaml P-011
      through P-016, every one of which carries check: not checkable. The session's own drift score
      blocks across the span score this aspect ABSENT with no argument against it.

      Recurrence, 2026-09-30 — audit A-003 of contract-004 (post-hoc), recorded by the main agent on
      reading the auditor's report (M-18): elevation_not_recovery ABSENT again, the only aspect
      marked so. In the auditor's words, contract-004's own observations O-070, O-071 and O-072
      "are all defects caught while correcting the documents against the running server (a
      first-run command exiting 78, mismatched byte limits, an OAuth endpoint mismatch), none a
      learning restated from prior clarity". The auditor's observation on it is O-080. Same aspect,
      same shape as the entry above: the contract's learnings are scars of what it found broken.
    reaction: |
      Not named as a trigger in-session at the point each recovery-shaped learning was recorded;
      surfaced only by this audit — which was itself impossible to run until the kit shipped the
      transcript digest today. The first audit this project has completed found it immediately,
      which is the argument for the mechanism rather than for the agent's self-reporting.
      2026-09-30: the recurrence was again surfaced only by a post-hoc audit, a week after the
      contract; nothing in-session named it. Counted here as a recurrence rather than a new entry.
    status: open
    elevation: []
    reviewed: null
