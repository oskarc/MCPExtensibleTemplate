# DRIFTLOG.yaml
# Project instance data for the drift event log. Governed by meta-drift-eventlog/SKILL.md.
# Seeded by meta-bootstrap. The agent writes entries and the open -> watching transition itself: recording an
# incident is not a judgement about it. Everything that judges an elevation needs the pioneer —
# watching -> mitigated when an authorised elevation is committed, mitigated -> resolved only at a review
# batch. Every write names its evidence; nothing is written silently.
# In the base-building-kit repo: templates/DRIFTLOG.template.yaml
# In a consumer project: .claude/skills/meta-drift-eventlog/DRIFTLOG.yaml
#
# AGENT INSTRUCTIONS:
# This file is a template. meta-bootstrap copies it to
# .claude/skills/meta-drift-eventlog/DRIFTLOG.yaml as the empty seed.
# Drift history is project-specific — it does not travel via meta-extract.
# A new project always starts with an empty entries list, regardless of any
# inherited type-category kit.
#
# Schema reference (full details in meta-drift-eventlog/SKILL.md):
#
#   - drift_id: drift-NNN                  # sequential, never reused
#     surfaced_in: YYYY-MM-DD / topic
#     surfaced_by: human | self | post-hoc
#     # aspect — one of:
#     #   agent: lay-of-the-land | stop-on-triggers | partner-mirror | elevation-not-recovery | evidence-as-work
#     #   human: exercise-judgment | closeness | distance | re-orient | approval-gate
#     #   meta:  meta
#     aspect: lay-of-the-land
#     description: |
#       Concrete, non-evaluative statement of what happened.
#     evidence: |
#       Cited referent — exact statement, log line, file:line.
#     reaction: |
#       What was done in-session in response.
#     status: open | watching | mitigated | resolved | legacy   # legacy: recorded under an earlier practice and deferred by the pioneer at an upgrade — counted by no hook, presented in no batch (contract-008)
#     elevation:
#       - target: skill, contract, mechanism or memory name
#         kind: new-skill | skill-update | mechanism-change | test-added | agent-added | memory-update | manifest-update
#         mitigation_medium: prose | mechanism | agent | test | memory | unknown
#         date: YYYY-MM-DD
#     reviewed: null                     # date a keep-watching decision was taken at a batch
#     recurrence_count: 0
#     related_drifts: []
#
# Lifecycle transitions follow the rules in meta-drift-eventlog/SKILL.md.

entries:
  - drift_id: drift-001
    surfaced_in: 2026-09-18 / contract-001 audit (A-001)
    surfaced_by: post-hoc
    aspect: stop-on-triggers
    description: |
      INTENT.md requires a drift score block at the end of every output (M-28, must). No block
      appears anywhere between the pioneer's "go" and contract-001 being marked implemented —
      the whole implementation phase, roughly 900 transcript lines and two hours across many
      turns. The last block before that stretch precedes the first line of production code.
    evidence: |
      Transcript C:/Users/Windows/.claude/projects/d--projects-mcp/40478952-60db-48c0-8fd4-97b093d57259.jsonl
      lines ~1835-2748 (auditor A-001, observation O-007). The pioneer's "go" is at
      2026-09-17T21:31:19Z; the contract was marked implemented at ~22:45:53Z.
    reaction: |
      None in-session. The blocks resumed only at the completion report. Recorded here on the
      auditor's finding; accepted without qualification.
    status: open
    elevation: []
    reviewed: null
    recurrence_count: 0
    related_drifts: []

  - drift_id: drift-002
    surfaced_in: 2026-09-18 / contract-001 audit (A-001)
    surfaced_by: post-hoc
    aspect: stop-on-triggers
    description: |
      G-5 left the climate tool's fate conditionally open, so the choice surfaced mid-build —
      the shape M-05 (design-ambiguity) names, and a departure from a conditional clause is the
      shape M-08 (deviation-found) names. Neither moment was named when the choice surfaced.
      The substance was done: the choice was put to the pioneer with evidence and they decided
      it (see O-009). What was missing is the naming of the moment, and the same omission covers
      the two other in-flight deviations (the CA1305/CA1848 holding and the WithHttpTransport
      fix), which were disclosed in the contract's revisions list but never named as M-08.
    evidence: |
      Auditor A-001, form.moments_named and form.spec_lock_when_due; observation O-008. The
      contract's revisions list carries all three deviations; no turn in the implementation
      stretch names M-05 or M-08.
    reaction: |
      None in-session; the deviations were written into revisions at the end rather than named
      when they arose.
    status: open
    elevation: []
    reviewed: null
    recurrence_count: 0
    related_drifts: []

  - drift_id: drift-003
    surfaced_in: 2026-09-18 / contract-001 verification follow-up
    surfaced_by: self
    aspect: evidence-as-work
    description: |
      A finding was reported to the pioneer as established fact — that any tool throwing
      McpException produced no JSON-RPC response, hanging the client — and their decision was
      asked for and given on it. The finding was an artifact of the probe used to establish it:
      it redirected the server's standard error and never drained it, so the pipe filled and the
      server blocked mid-request. A change to approved structure (the call-tool filter pipeline)
      was made on that basis.

      The bisection presented alongside it looked rigorous and was not: six configurations, each
      differing in how much it logged on the failure path rather than in how it handled failure.
      Consistency across variants was read as confirmation when it was one artifact recurring.
    evidence: |
      Observation O-014. Re-run of the same probe with stderr drained, against the original
      rethrowing filter restored from 66e8477: the server answers with the message intact. The
      acceptance test written to prove the fix carried the same flaw and has been corrected; the
      suite now runs in about five seconds where it took over a minute.
    reaction: |
      The filter change was reverted, the test harness fixed to drain stderr, and the ledger and
      contract entries carrying the false claim corrected rather than rewritten. The provider's
      error mapping was kept, on kit-verifier's independent finding.
    status: open
    elevation: []
    reviewed: null
    recurrence_count: 0
    related_drifts: []
