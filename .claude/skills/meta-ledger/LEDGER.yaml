      Two rules follow. The founding statement says what the work serves and the roadmap says what
      that means this phase: bearing is read against the first, scope against the second, and
      reasoning from one without the other produces a conclusion that survives review on its tone.
      And correct and applied understanding is the foundational output, the only one with no
      instrument - a contract drawn, a clause verified, a task discharged and a score emitted are
      all artefacts, and every one of them was green while the understanding beneath was thin.

      Why no check reaches it: a coherent account suppresses the impulse to check, because the
      agent does not experience itself as not knowing. Before any hypothesis, establish full scope
      is therefore an epistemic rule whose trigger is absent exactly when it is needed. The only
      instrument that worked across this contract was a person asking a question that had no
