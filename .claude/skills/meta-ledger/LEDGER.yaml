    statement: |
      Three things in contract-002 were found by running the server and could not have been found
      any other way, and they share a shape: each was a security control behaving correctly and
      costing something nobody had priced.

      The router forwarded unattributable requests to the MCP challenge scheme, whose handler
      authenticates through the default scheme — the router. The server died of a stack overflow
      on its first unauthenticated request. It compiled, and every unit test passed.

      Requiring identity configuration for stdio was correct and would have made the template
      unrunnable for a local IDE without a production-shaped config file. The guarantee was right;
      its reach was wrong.

      G-12 refused the contract's own HTTP tests, because they run as Production over loopback
      plaintext. The guardrail was working on its first day, against its author.

      The transferable point: a security control's cost lands on whoever is nearest, and that is
      usually the developer, the test harness, or the local workflow — none of which appear in the
      threat model that justified the control. Writing the guarantee is not the hard part. Finding
      out who pays for it requires running it, and the three cases here were all paid by someone
      other than the attacker it was aimed at.
