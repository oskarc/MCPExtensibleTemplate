            document on the well-known path with resource, authorization_servers and
            scopes_supported as configured.
        - clause: G-3
          verdict: verified
          evidence: |
            Reconstructed: a policy scheme routes on the token's unvalidated iss, refuses tokens
            over 8 KB, and refuses an unregistered issuer before any key lookup
            (IdentityRegistration.cs:181-190; roadmap P1.10).
            Verified by T-4 and T-5, both outcome-level and both non-vacuous: T-4 asserts 401 and
            that the stranger's endpoint recorded zero requests AND that the registered provider's
            JWKS count did not move - the only way to observe a lookup that did not happen. T-5
            mints a token naming corp's issuer but signed by an impostor key and asserts 401, which
            is the test of the "safe only because the target scheme pins the issuer" argument.
            Read at IdentityRegistration.cs:186-222: unattributable tokens go to a scheme that
            holds no keys and consults nothing, so an unknown issuer cannot provoke a fetch.
        - clause: G-4
          verdict: verified
          evidence: |
            Reconstructed: AddAuthorizationFilters() on the MCP builder, MapMcp().RequireAuthorization(),
            and [Authorize] at class level on every tool, resource and prompt type as defence
            beneath it (HttpServerComposition.cs:52; roadmap P1.3).
            Read and counted: HttpServerComposition.cs:52 registers AddAuthorizationFilters(),
            :164-166 calls UseAuthentication/UseAuthorization then MapMcp().RequireAuthorization().
            All five MCP-attributed types carry [Authorize] - SmhiTools.cs:39, SmhiObsTools.cs:17,
            JsonPlaceholderTools.cs:37, SmhiResources.cs:28, SmhiPrompts.cs:27; a grep for
            McpServerToolType/ResourceType/PromptType returns exactly those five and each is
            preceded by [Authorize].
            Outcome checked too: ServerProcessTests.T4_the_mcp_endpoint_requires_a_verified_token
            passes, and my own run of the Release binary answered an unauthenticated tools/list
            with 401 and an empty body.
        - clause: G-5
          verdict: open
          evidence: |
            Reconstructed: each provider is bound to exactly one identity provider; two providers
            may share one, none may have none, and a tool belonging to no provider stops the server
            (ProviderBinding.cs:8; TrustDomainFilters.cs:11-18; McpProviderAttribute.cs:6; the
            Phase 1 exit criterion asks for tools absent from tools/list AND a direct call denied
            with rule idp-binding).
            What is checked: T-6, seven passing cases, all of them against ProviderBinding.Allows
            directly - a caller reaches only its own provider's tools, two providers may share an
            identity provider, a caller with no idp claim reaches nothing, an unknown tool is
            refused rather than assumed open, and three startup refusals (a provider with no
            binding, a provider bound to an unconfigured identity provider, a tool belonging to no
            provider). The decision function is well covered and I read nothing wrong in it.
            What is not checked: the enforcement path. TrustDomainFilters.List() and .Call() - the
            code that actually removes tools from a listing and throws
            "authz_fail (rule: idp-binding)" - are registered only at Program.cs:241-242, and the
            in-process harness composes its own MCP server without them (InProcessServer.cs:86-92).
            No test in the tree executes either filter body, so the exit criterion's two assertions
            (absent from tools/list, direct call refused by name) are verified by reading only.
            Two fail-open branches in that unexecuted code are worth naming while it is untested:
            both filters return next(...) unchanged when ProviderBinding is not resolvable from
            context.Services (TrustDomainFilters.cs:38-42 and :64-68), and the call filter also
            passes through when MatchedPrimitive is not an McpServerTool (:57-61).
            Held open rather than corrected: nothing I ran shows it wrong, and nothing I ran shows
            it right.
        - clause: G-6
          verdict: verified
          evidence: |
            Reconstructed: stdio runs as a principal declared in Development:DevPrincipal and
            validated against the identity provider it claims to come from
            (DevelopmentPrincipal.cs:9; Program.cs:117-127; roadmap P1.9).
            Verified by T-7, four cases, all passing: stdio runs as a named principal with no
            identity configured; the principal is what configuration says it is (sub, client_id,
            scope asserted); a development scope the named identity provider's catalog cannot
            issue is refused; a development principal naming an unconfigured provider is refused.
            The refusals are the load-bearing half - they stop the failure that only appears on
            deployment.
        - clause: G-7
          verdict: verified
          evidence: |
            Reconstructed: an Origin guard ahead of authentication - a present Origin not in
            HttpTransport:AllowedOrigins gets 403 and a malicious_cors log event; an absent Origin
            passes (OriginGuardMiddleware.cs:6-18; roadmap P1.5).
            Verified by T-8 in both of its forms, both passing: ServerProcessTests.cs:556 (foreign
            Origin refused before the token is examined, against a spawned server) and
            TokenRejectionTests.cs:124 (foreign Origin refused even when the token is valid - the
            case that matters, since a browser already holds one). Position read at
            HttpServerComposition.cs:161-163: UseMiddleware<OriginGuardMiddleware>() precedes
            UseAuthentication(). The malicious_cors event is emitted at
            OriginGuardMiddleware.cs:49-51; I did not find an assertion on the log line itself, so
            the 403 is tested and the SIEM event is verified by reading only.
        - clause: G-8
          verdict: verified
          evidence: |
            Reconstructed: identity configuration binds at startup or the server exits 78 naming
            the setting (IdentityConfigurationBinder.cs:6; roadmap P1.10 second half).
            Verified by T-9, seventeen passing cases in IdentityConfigurationTests: a well-formed
            configuration binds; no identity provider at all is refused; six malformed settings are
            each refused *by name*; algorithms outside the RS/PS/ES allowlist and an empty list are
            refused; an empty and a wildcard scope catalog are refused; an AdminIdentityProvider
            that does not exist, or that lacks mcp:admin in its catalog, is refused. The exit code
            half is covered end-to-end by ServerProcessTests.T3_http_without_identity_configured_is
            _a_configuration_failure and T3_a_malformed_setting_exits_78, both passing.
        - clause: G-9
          verdict: open
          evidence: |
            I could not establish what G-9 says. It has no recorded text (no tier_3), and unlike
            every other guardrail it carries no annotation anywhere in the tree: a grep of
            McpServerTemplate and McpServerTemplate.Tests for "G-9" returns nothing, while G-1..G-8
            and G-10..G-12 each appear in at least one file. Nor does any test id map to it.
            The commit at b55bc61 claims "the last of the twelve guardrails" and 0a9904c claims
            "twelve of twelve guardrails implemented"; I can account for eleven.
            The Phase 1 material left over once G-1..G-8 and G-10..G-12 are accounted for is P1.8
            (a scope catalog per identity provider, insufficient scope -> 403 with
            WWW-Authenticate: Bearer error="insufficient_scope", a structured error naming the
            missing scope at the tool layer) and P1.7 (delete ApiKeyMiddleware, per-IP limiter
            before authentication). Of those, as the tree stands: ApiKeyMiddleware.cs is gone and
            the per-IP limiter runs before authentication (HttpServerComposition.cs:159-164), so
            P1.7 holds; but ScopeCatalog is only ever read at startup validation, for the metadata
            document's scopes_supported union, and for the development principal - nothing in
            McpServerTemplate compares a caller's scopes against a tool, no 403 with
            insufficient_scope is produced anywhere, and there is no /admin endpoint for
            AdminIdentityProvider to guard. If G-9 was P1.8, it is not implemented; if it was P1.7,
            it is. I will not guess which.
            Closed by the approved tier_3 text.
        - clause: G-10
          verdict: verified
          evidence: |
            Reconstructed: every test in this phase runs without reaching the network, which is
            what makes the token guarantees checkable at all (TestIdentityProvider.cs:12;
            InProcessServer.cs:19; HttpServerComposition.cs:9-19).
            TestIdentityProvider holds its own RSA key, serves discovery and JWKS through an
            in-process HttpMessageHandler and counts the requests; InProcessServer.StartAsync
            injects it as JwtBearerOptions.BackchannelHttpHandler via the
            configureIdentityForTests seam, which nothing in the shipped server passes. The whole
            185-test suite completed in 8 seconds on my run with no authority reachable, and
            TestIdentityProviderTests (8 cases) checks the fixture itself before anything rests on
            it - a minted token validates, one provider's token does not validate against another,
            audience/expiry/HMAC are as claimed.
            One inaccuracy in the comment that sells this seam: InProcessServer builds its MCP
            server with its own AddMcpServer(...).WithToolsFromAssembly(...) chain
            (InProcessServer.cs:86-92), not Program.cs's ConfigureMcpServer, so it does NOT
            register the request filters Program.cs:233-243 registers. "The same registration, the
            same middleware order, the same filters" (InProcessServer.cs:22) is true of the
            middleware and the identity registration, and false of the filters. That does not
            weaken T-2/T-4/T-5, which are about token validation; it is why G-5 is open below.
        - clause: G-11
          verdict: verified
          evidence: |
            Reconstructed: stateless streamable HTTP, no session affinity, no Mcp-Session-Id
            (HttpServerComposition.cs:49-51; roadmap P1.4).
            Verified by T-11 (MetadataAndStatelessTests.T11_two_calls_on_different_connections_
            both_succeed, passing): two calls on entirely separate clients both succeed and no
            Mcp-Session-Id is issued. Read at HttpServerComposition.cs:50:
            .WithHttpTransport(options => options.Stateless = true).
        - clause: G-12
          verdict: corrected
          evidence: |
            Reconstructed: in Production the server refuses to start unless it terminates TLS
            itself or names the proxy in front of it (TransportSecurityGuard.cs:6-15; roadmap P1.6;
            the revision recorded above pulled TLS back into scope as G-12/T-12).
            What is actually true: the startup check passes on configuration that produces neither.
            There is no HTTPS listener anywhere in this server - Program.cs:174 is
            `builder.WebHost.UseUrls($"http://{bindAddress}:{port}")`, unconditionally - and
            nothing reads HttpTransport:Certificate:Path or :Subject except the guard itself
            (TransportSecurityGuard.cs:37-38; a grep of McpServerTemplate for Certificate finds
            only those two lines). So setting a certificate path satisfies the "terminates TLS"
            branch while the server serves plaintext.
            Checked, not inferred: I ran the Release binary with ASPNETCORE_ENVIRONMENT=Production,
            Transport=http, HttpTransport__Certificate__Path=D:/does-not-exist/server.pfx and no
            KnownProxies/KnownNetworks. It started, logged "Starting MCP server with HTTP transport
            on 127.0.0.1:38251", served the metadata document over http:// with 200, and answered
            an unauthenticated POST with `WWW-Authenticate: Bearer resource_metadata="http://...`.
            Its own log carries the confirmation: "HttpsRedirectionMiddleware: Failed to determine
            the https port for redirect." Bearer tokens over plaintext in Production, which is the
            exact outcome the guardrail's own doc comment says would make the rest of the phase
            theatre.
            The second branch is nominal in a quieter way: HttpTransport:KnownProxies and
            :KnownNetworks are read only by the guard. ForwardedHeadersOptions
            (HttpServerComposition.cs:83-88) sets ForwardedHeaders and ForwardLimit and never
            assigns KnownProxies/KnownNetworks, so the trusted-proxy list a deployment writes to
            satisfy G-12 has no effect on which forwarded headers are believed (the defaults stay
            at loopback).
            T-12 passes and is green on all six of its cases because it calls
            TransportSecurityGuard.Validate in isolation and asserts only that it throws or does
            not throw. It tests the mechanism; the outcome it stands for does not hold.
      summary: {verified: 9, corrected: 1, open: 11}
      open_needs:
        - "UC-1..UC-9 and G-9: the approved tier_1-tier_4 text of contract-002 recorded in this
           entry. Every use-case verdict is blocked on the same missing thing."
        - "G-5: an end-to-end case - a valid token from identity provider B against a provider
           bound to A - asserting the provider's tools are absent from tools/list and that a direct
           call returns authz_fail with rule idp-binding. TrustDomainFilters.List()/Call() are
           registered only in Program.cs:241-242 and are not registered by the in-process harness,
           so no test executes either filter body."
        - "T-10 and T-13: the two acceptance tests the commit message counts but the tree does not
           contain. Recording tier_4 would say what they were meant to check."
    revisions:
      - what: |
          P1.6 gap, first half. UseHsts() is named in the roadmap's Phase 1 and is absent from the
          source entirely — it appears in no contract clause, no test and no verification. Added
          beside UseHttpsRedirection in the middleware order P0.7 fixes. Over plaintext it changes
          no behaviour: the header is emitted on HTTPS responses only, so the loopback tests that
          run Production over http are untouched.
        authorised_by: pioneer
        date: 2026-09-20
        tests_changed: []
      - what: |
          P1.1 gap. OnTokenValidated refuses a token with no jti and stops there; the roadmap also
          requires sub, client_id (or azp) and iat. And OnAuthenticationFailed -> authn_login_fail
          does not exist, so an authentication failure produces no named audit event in a project
          whose roadmap cites the OWASP Logging Vocabulary. Both added, the log event following the
          malicious_cors precedent in OriginGuardMiddleware.
          Blast radius measured before approval, and the measurement was wrong in the safe
          direction: the first pass grepped for `new Claim(` and concluded TestIdentityProvider
          minted only Sub and Jti. It already mints client_id and IssuedAt, so none of the 25
          MintToken call sites needed changing. DevelopmentPrincipal did carry no iat, and gained
          one.
          One real surprise, caught by a test: JsonWebTokenHandler stamps iat whether or not the
          descriptor asks for it, so the first `no iat` case minted a token that still carried the
          claim and was rightly accepted. The fixture gained MintTokenWithout, which strips a claim
          and re-signs — the only way to present a token a standard library would not produce.
          All three new cases were seen to fail with the enforcement removed and pass with it
          restored, each bound to its own check.
        authorised_by: pioneer
        date: 2026-09-20
        tests_changed: [T-2]
      - what: |
          P1.6 gap, second half, RECORDED BUT NOT EXECUTED. Kestrel serving HTTPS with a certificate
          from the vault is unbuilt; TransportSecurityGuard accepts HttpTransport:Certificate:Path
          or :Subject as evidence that it is, and nothing reads either key, so the branch is a claim
          the server cannot honour. This was nearly removed as a loophole (O-031) before the roadmap
          showed it to be a Phase 1 deliverable.
          Not executed because the lay of the land is incomplete and saying otherwise would be the
          third guess this session at something the roadmap underspecifies. Two unknowns, neither
          resolvable by reading: what "from the vault" means at Phase 1, when I8 allows a vault or
          dotnet user-secrets and the vault proper is P6.3 in Phase 6; and where a certificate
          password comes from, there being no config key for one. A third question follows from
          either answer — whether the listener is opt-in, since ResourceMetadataTests and
          ServerProcessTests spawn the shipped executable over http.
          RESOLVED 2026-09-20, the pioneer deciding: "right we should move it to the phase
          handling that part." The Kestrel HTTPS listener moves to Phase 6, where P6.4 already
          covers TLS termination at the ingress or in Kestrel, and carries the two open questions
          with it — what "from the vault" means, and where a certificate password comes from.
          The move alone would have left the false claim standing, so G-12 narrowed in the same
          act: TransportSecurityGuard now names only the proxy branch, and a certificate setting
          is refused with an explanation rather than accepted as evidence of a protection this
          server does not provide. The roadmap records the move at P1.6, P6.4 and the SPEC-06
          conformance row. The branch returns when the listener does.
          Context the pioneer gave alongside the decision: the system will not be used until it is
          through the whole roadmap, so the deferral carries no interim exposure.
        authorised_by: pioneer
        date: 2026-09-20
        tests_changed: [T-12]
      - what: |
          Drawn with TLS moved out of Phase 1 into Phase 6, on the reasoning that it is a deployment
          concern untested by Phase 1's exit criteria. Withdrawn before approval when the pioneer
          asked for the reasoning: a bearer token over plaintext makes the rest of the phase theatre;
          "untested by the listed criteria" is the same inference that produced contract-001's
          defects; and P1.6's requirement (refuse to start in Production without TLS or restricted
          forwarded headers) is startup-testable, the shape already built twice. TLS is in scope as
          G-12 and T-12.
        authorised_by: agent
        date: 2026-09-18
        tests_changed: []
    cost: null
    work_id: null

  - contract_id: contract-001
    feature: phase-0-foundation
    type: contract
    date_proposed: 2026-09-17
    date_approved: 2026-09-17
    bearing: |
      This contract makes the base governable: after it, a defect in this server fails a build instead of
      reaching a user, and the platform under the frame is current and honest about failure. The bet is that
      the frame your statement calls the core cannot hold integrity on a base where six tools silently return
      empty data and stdio opens a port nobody asked for.
    tier_1: |
      Who. Two users. The teams who will run this server - a dev team, or an organisation centralising MCP
      access. And, because this is a foundational contract, whoever builds the later phases on it: us.
      What they are trying to do. Run the server and trust what it says. Build the provider frame on top of
      it without inheriting surprises.
      Success. The server starts only the way it was configured to start. Every tool returns real data or an
      error that says what to do. A broken change fails a build before anyone runs it. The runtime still
      receives security updates.
      Cost of skipping. Six of this server's tools return empty values and report success. Running it for an
      IDE opens a network port that serves nothing. A crash exits with code 0, so a supervisor believes it is
      healthy. .NET 8 stops receiving security updates on 10 November 2026. Nothing runs on push.
    tier_2: |
      UC-1 Run the server for an IDE (stdio) -> speaks MCP over stdin/stdout, opens no network port. Outside
           development it refuses to start rather than running unauthenticated.
      UC-2 Run the server over HTTP -> listens only on the configured address; requests cross middleware in a
           fixed order. A failure to bind is a failure, not a silent success.
      UC-3 Call a demo-provider tool -> returns the actual record. An upstream error returns a message naming
           the recovery, never an empty shell reported as success.
      UC-4 Ask for historical climate data -> returns data, or the tool does not exist. No tool that cannot
           succeed against its upstream stays on the list.
      UC-5 Upstream is slow or failing -> times out on the provider's budget; documented retries happen. The
           client-level timeout never cuts the retry budget short.
      UC-6 Probe health from an orchestrator -> liveness and readiness answer immediately; startup makes no
           upstream calls.
      UC-7 Open the repo as a developer -> one command builds and tests everything; the same runs on every
           push. Warnings, vulnerable packages and committed secrets fail the build.
      UC-8 Read the docs and wire a client -> documented tool names are the names the server exposes.
      UC-9 Take delivery of the phase -> the finished work is on the remote branch for review.
    tier_3: |
      G-1  (UC-1) stdio builds a plain host with no web server, and only in Development; anywhere else it
           exits 78.
      G-2  (UC-1, UC-2) Unhandled failure exits 70, configuration failure exits 78; never 0.
      G-3  (UC-2) Middleware order fixed: forwarded headers, HTTPS, host allowlist, CORS, rate limiter,
           authentication. The per-tool throttle keys only on tool names the server registered.
      G-4  (UC-3) The demo provider deserialises with web-style casing and explicit property names; every
           tool returns a populated model or throws with a recovery hint.
      G-5  (UC-4) No tool remains that cannot succeed against its upstream. If the climate tool stays, it
           reads the CSV endpoint and filters by month before capping rows.
      G-6  (UC-5) The client timeout does not cap the resilience pipeline; total timeout exceeds attempt
           timeout x (1 + retries), asserted at startup.
      G-7  (UC-6) Liveness and readiness endpoints replace the startup probe; no upstream call before
           serving.
      G-8  (UC-7) One solution file; warnings are errors; both projects on .NET 10 and MCP SDK 2.2.0, with
           deprecations resolved rather than suppressed.
      G-9  (UC-7) CI on every push: locked restore, build, test, package audit as errors, secret scan.
      G-10 (UC-7) No credential in the repository; development reads secrets from user-secrets.
      G-11 (UC-8) Documented tool names equal the names the server exposes.
      G-12 (UC-9) The phase ends committed and pushed on epic/security-hardening.
      Note: the kit has no project nodes yet, so every guardrail here is novel - each is a candidate for an
      observation once the work is done. No precedent carried M-04; nothing applied or distinguished.
    tier_4: |
      T-1  (G-1) Spawn the built server with Transport=stdio in Development, send initialize, inspect the
           process's listening sockets. Fails if any listener exists, or no JSON-RPC reply reaches stdout.
      T-2  (G-1) Start with ASPNETCORE_ENVIRONMENT=Production and Transport=stdio. Fails if the exit code is
           anything but 78, or the process serves a request.
      T-3  (G-2) Start with a provider BaseUrl of http (configuration error), then force an unhandled startup
           failure. Fails if either exits 0; expected 78 and 70.
      T-4  (G-3) Send a request with a foreign Host header; then call 100 invented tool names and inspect the
           throttle's key set. Fails if the host request reaches authentication, or the key set contains
           anything but registered tool names.
      T-5  (G-4) Feed the demo provider a recorded camelCase upstream payload and call each of its six tools.
           Fails if any returns an id of 0, an empty title, or an empty collection reported as success. Then
           return HTTP 500: fails if the error message does not name a recovery.
      T-6  (G-5) Enumerate registered tools and run each against a recorded response. Fails if any tool is
           registered that has no path to success - specifically if the climate tool is still registered
           while its upstream serves only CSV.
      T-7  (G-6) Assert at startup that total timeout exceeds attempt timeout x (1 + retries); have a fake
           upstream stall past the attempt timeout and count attempts. Fails if the assertion does not hold
           or fewer attempts are made than configured.
      T-8  (G-7) Start with a fake handler that records calls, then GET /healthz and /readyz. Fails if either
           does not return 200, or the handler recorded a call before the first request arrived.
      T-9  (G-8) Run dotnet build McpServerTemplate.sln -warnaserror; read both project files and package
           versions; grep for suppressions added around SDK deprecations. Fails if the build errors, either
           project is not net10.0, the MCP packages are not 2.2.0, or a deprecation was silenced with
           NoWarn or pragma instead of resolved.
      T-10 (G-9) Run the workflow's own steps locally against seeded fixtures: a package with a known
           advisory, a lock file out of step, a planted secret. Fails if any of the three passes.
      T-11 (G-10) Run the secret scan over the tree and read every appsettings json file. Fails if the scan
           reports anything, or an API key value is present in configuration.
      T-12 (G-11) Enumerate registered tool names and search the docs for each. Fails if a documented name
           does not exist, or a PascalCase spelling of a tool name appears in the docs.
      T-13 (G-12) Check the working tree is clean and the head commit exists on
           origin/epic/security-hardening. Fails if either is untrue.
      untested: G-3's full middleware order - T-4 proves the host check precedes authentication, but not the
           position of every stage; the rest is verified by reading. G-2's exit code 70 - forcing a genuinely
           unhandled failure deterministically may not be possible; if it is not, that half of T-3 becomes a
           reading check. G-8's "resolved rather than suppressed" - T-9 catches the two common suppressions,
           but a deprecation avoided some other way would pass.
    disappointment: |
      Same as it reads.
      (Given for all twelve guardrails, G-1 to G-12, in answer to "what result would make you say this
      wasn't met?")
    premortem: |
      Pre mortem, well if those acceptance criteria is not enforced it would be considered a failiure.
    red_test:
      broke: G-4
      went_red: T-5
      note: |
        Not staged. G-4 is broken in the tree today - the case-sensitive deserialisation this
        contract fixes - so T-5 went red against the current code on first run: 4 failed, 0
        passed, every assertion reading id 0 where the recorded upstream sent 1 (and 101 for
        the created post). Test file: McpServerTemplate.Tests/Providers/JsonPlaceholder/
        JsonPlaceholderRoundTripTests.cs
      date: 2026-09-17
    approval: approved-at-gate
    status: learned
    verification_state: closed
    verification:
      date: 2026-09-18
      by: kit-verifier
      method: mixed
      tests: {T-1: pass, T-2: pass, T-3: pass, T-4: pass, T-5: pass, T-6: pass, T-7: pass,
              T-8: pass, T-9: pass, T-10: pass, T-11: pass, T-12: fail, T-13: pass}
      corrections_from_tests: 2
      corrections_from_reading: 1
      tests_note: |
        Fifth report, at head ea9b51d (= origin/epic/security-hardening), after the evidence named in
        verification_history arrived. Every clause was re-established from evidence gathered in this
        pass; the five verdicts the fourth pass recorded before it stopped were not carried over.
        dotnet build McpServerTemplate.sln -warnaserror: 0 warnings, 0 errors. dotnet test
        McpServerTemplate.sln --configuration Release: 120 passed, 0 failed, read off a trx so each
        T-x id was taken from its own named test. CI run 35389659817 for this exact headSha: all five
        steps green (Restore locked, Build warnings-are-errors, Test, Audit packages, Secret scan).
        Tier 4 halves that no automated test reaches were executed here rather than read. Probe
        method: the server was driven as a child process with stderr drained on its own thread as raw
        bytes, so a full pipe could not be mistaken for a hang.
          T-3   - seven configuration failures all exit 78, including the provider BaseUrl over http
                  that T-3 names and that exited 70 at the third report; an occupied bind port exits
                  70. Neither half exits 0.
          T-4   - 100 tools/call requests to invented names (40 distinct) minted no limiter: all 100
                  answered Unknown tool, none rate-limited, while get_blog_post was limited from its
                  6th call against a cap of 5.
          T-7   - a TCP listener that accepts and never answers, as the fake upstream: one call made
                  exactly 3 attempts (1 + 2 retries) over 16.3s and then named a recovery.
          T-8   - all three providers pointed at a connection recorder: zero upstream connections
                  through startup and the probe requests, /healthz 200 alive, /readyz 200 ready.
          T-10  - all three fixtures in an out-of-tree clone of this head: planted AKIA key gives
                  secret scan exit 1; an ApiKey value in appsettings.json gives exit 1; Newtonsoft.Json
                  9.0.1 gives NU1903 Warning As Error and Build FAILED; the same package with the lock
                  untouched gives NU1004 under --locked-mode.
          T-12  - recorded fail. Its first half holds; its second stated failure condition, "a
                  PascalCase spelling of a tool name appears in the docs", is met by the tree (13
                  occurrences in 6 files, five of them presented to a reader as tool names). The two
                  automated T-12 tests pass because their PascalCase check only reads markdown tool
                  tables. This red is what corrected UC-8 and G-11, so both count as corrections from
                  tests.
          T-13  - local HEAD and origin/epic/security-hardening are both ea9b51d with nothing unpushed;
